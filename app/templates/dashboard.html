<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiToEarn - ETF 板块轮动仪表盘</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-3.0.0.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 区域1：顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">AiToEarn</a>
    <div class="navbar-nav me-auto">
      <div class="btn-group btn-group-sm ms-3" role="group" id="scheme-toggle">
        <button class="btn btn-outline-danger" data-scheme="A">A 激进</button>
        <button class="btn btn-outline-primary active" data-scheme="B">B 平衡</button>
        <button class="btn btn-outline-success" data-scheme="C">C 稳健</button>
      </div>
    </div>
    <div class="navbar-nav">
      <span class="navbar-text me-3" id="nav-status">
        数据状态: <span class="badge bg-secondary">加载中...</span>
      </span>
      <span class="navbar-text me-2" id="nav-update-time"></span>
      <button class="btn btn-warning btn-sm" id="btn-refresh">🔄 刷新</button>
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">

  <!-- 区域2：ETF评分排行榜 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>ETF 评分排行 <small class="text-muted" id="ranking-date"></small></span>
      <div>
        <select class="form-select form-select-sm d-inline-block w-auto" id="session-select">
          <option value="final">收盘数据</option>
          <option value="intraday">盘中数据</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm ms-1" id="btn-export">⬇ CSV</button>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height:500px; overflow-y:auto">
        <table class="table table-hover table-sm mb-0" id="ranking-table">
          <thead class="table-dark sticky-top">
            <tr><th>排名</th><th>代码</th><th>名称</th><th>板块</th><th>20日涨幅</th><th>上涨天数</th><th>评分</th><th>MA60</th><th>持仓状态</th></tr>
          </thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 区域3：操作指令 — 左右两栏 -->
  <div class="action-card mb-3" id="action-panel">
    <div class="row">
      <!-- 左栏：当前持仓 -->
      <div class="col-md-6">
        <div class="action-section">
          <div class="section-title">📊 当前持仓</div>
          <div class="section-subtitle">（本周五收盘前有效）</div>
          <div id="current-holdings">
            <div class="text-muted small">加载中...</div>
          </div>
        </div>
      </div>
      <!-- 右栏：下周持仓 -->
      <div class="col-md-6">
        <div class="action-section">
          <div class="section-title">📅 下周持仓（换仓后）</div>
          <div class="section-subtitle">
            下次换仓日: <span id="rb-next-date">--</span>
          </div>
          <div id="next-week-holdings">
            <div class="text-muted small">加载中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 区域4：收益曲线 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>收益曲线</span>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" data-range="ytd">今年</button>
        <button class="btn btn-outline-secondary" data-range="3m">近3月</button>
        <button class="btn btn-outline-secondary active" data-range="all">全部</button>
      </div>
    </div>
    <div class="card-body p-2">
      <div id="chart-equity" style="height:420px"></div>
    </div>
  </div>

  <!-- 区域5：账户总览卡片行（移至底部） -->
  <div class="row mb-3" id="overview-cards">
    <div class="col-6 col-md-3 mb-2">
      <div class="overview-card">
        <div class="label">账户总资产</div>
        <div class="value" id="ov-total-asset">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-2">
      <div class="overview-card">
        <div class="label">累计收益</div>
        <div class="value" id="ov-cum-pnl">--</div>
        <div class="sub" id="ov-cum-pct">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-2">
      <div class="overview-card">
        <div class="label">最大回撤</div>
        <div class="value" style="color:#e74c3c" id="ov-max-dd">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3 mb-2">
      <div class="overview-card">
        <div class="label">夏普比率</div>
        <div class="value" id="ov-sharpe">--</div>
      </div>
    </div>
  </div>

  <!-- 区域6：底部两栏 -->
  <div class="row mb-3">
    <!-- 左栏：换仓历史 -->
    <div class="col-md-7">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>换仓历史</span>
          <button class="btn btn-outline-secondary btn-sm" id="btn-more-history" style="display:none">查看更多</button>
        </div>
        <div class="card-body" style="max-height:400px; overflow-y:auto">
          <div class="timeline" id="trade-timeline">
            <div class="text-muted small">加载中...</div>
          </div>
        </div>
      </div>
    </div>
    <!-- 右栏：策略统计 -->
    <div class="col-md-5">
      <div class="card">
        <div class="card-header">策略统计指标</div>
        <div class="card-body" id="strategy-stats">
          <div class="stat-row"><span class="label">平均每次换仓换手只数</span><span class="value" id="st-avg-turnover">--</span></div>
          <div class="stat-row"><span class="label">信号稳定性(近4周Top3重叠度)</span><span class="value" id="st-stability">--</span></div>
          <div class="stat-row"><span class="label">持仓最长连续持有</span><span class="value" id="st-max-hold">--</span></div>
          <div class="stat-row"><span class="label">本年换仓总次数</span><span class="value" id="st-total-rebalance">--</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
